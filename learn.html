<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Words | WordSprout</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/WordSprout.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="learn-page-modern">
  <main class="learn-shell">
    <header class="learn-topbar">
      <a href="index.html" class="learn-home-link">
        <i class="fas fa-arrow-left"></i>
        <span>Home</span>
      </a>

      <div class="learn-progress-card">
        <span class="learn-progress-label">Progress</span>
        <strong class="learn-progress-value">
          <span id="current">1</span> / <span id="total">0</span>
        </strong>
      </div>
    </header>

    <section class="learn-hero-card learn-hero-split">
      <div class="learn-hero-left">
        <div class="learn-badge-row">
          <div id="category" class="learn-category-badge">All Words</div>
          <div id="emoji" class="learn-emoji-badge">📘</div>
        </div>

        <p class="learn-mini-label">WordSprout</p>
        <h1 id="word" class="learn-main-word">Loading...</h1>
        <div id="phonetic" class="learn-main-phonetic"></div>
        <p class="learn-subtext">Learn, play, and grow new words.</p>

        <button id="play-audio" class="button learn-audio-button" aria-label="Play word audio">
          <i class="fas fa-volume-up"></i>
          Say It Aloud
        </button>
      </div>

      <div class="learn-hero-image-wrap">
        <div class="learn-hero-image-stage">
          <img id="word-image" class="word-image hidden" src="" alt="Word Image">
          <div class="loader" id="loader"></div>
        </div>
      </div>
    </section>

    <section class="learn-details-panel">
      <div class="learn-info-block">
        <div class="learn-info-label">Meaning</div>
        <div id="definition" class="learn-definition-text"></div>
      </div>

      <div class="learn-info-block">
        <div class="learn-info-label">Example</div>
        <div id="example" class="learn-example-text"></div>
      </div>

      <div class="learn-controls">
        <button id="prev-word" class="button learn-nav-button">
          <i class="fas fa-arrow-left"></i>
          Previous
        </button>

        <button id="next-word" class="button learn-nav-button">
          Next
          <i class="fas fa-arrow-right"></i>
        </button>
      </div>

    </section>
  </main>

  <script src="data.js"></script>
  <script src="learn.js"></script>
</body>
</html>
